[project]
name = "forget-not-backend"
version = "0.1.0"
description = "forget-not local FastAPI backend (HackRU 2026 prototype)"
requires-python = "==3.11.*"
dependencies = [
    "anthropic==1.13.0",
    "fastapi==0.143.0",
    "google-genai==2.29.0",
    "httpx==0.28.1",
    "insightface==2.1",
    "numpy==2.4.6",
    "onnxruntime==1.31.0",
    "opencv-python==5.0.0.93",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # scikit-image deprecation inside InsightFace 2.1 alignment; harmless with locked versions.
    "ignore:`estimate` is deprecated:FutureWarning:insightface.utils.face_align",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends()/File() defaults
